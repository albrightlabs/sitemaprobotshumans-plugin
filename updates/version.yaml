1.0.1: First version of Sitemap Robots Humans
1.0.2:
    - Fixed security vulnerabilities
    - Added proper response handling
    - Added content sanitization
    - Added validation rules
    - Updated for October CMS 3.x compatibility
    - Added plugin.yaml for marketplace
    - Improved XML formatting
    - Added null safety checks
1.0.3:
    - Added full RainLab.Pages compatibility
    - Static pages now included in sitemap.xml
    - Added setting to toggle RainLab.Pages inclusion
    - Automatic detection of RainLab.Pages plugin
1.0.4:
    - Added OFFLINE.Boxes plugin compatibility
    - Visual page builder pages now included in sitemap.xml
    - Added setting to toggle OFFLINE.Boxes inclusion
    - Automatic detection of OFFLINE.Boxes plugin
    - Enhanced error handling for missing plugins
1.0.5:
    - Removed main navigation menu item
    - Plugin now only appears in Settings panel for cleaner admin UI
1.0.6:
    - Adds Tailor support
    - Adds support for sub-site sitemap
1.0.7:
    - Dynamic Tailor section support - configure any Tailor section for sitemap inclusion
    - Replaced hardcoded case studies with configurable repeater
    - Per-section URL prefix, priority, and change frequency settings
1.0.8:
    - UI Updates
1.0.9:
    - Added URL exclusion feature - exclude specific URLs or patterns from sitemap
    - Configurable exclusion patterns in Sitemap settings
    - Exclusions apply to all page types (CMS, RainLab.Pages, OFFLINE.Boxes, Tailor)
1.0.10:
    - Fixed closure scoping issue with URL exclusion helper function
1.1.0:
    - Added /llms.txt and /llms-full.txt routes for AI discovery
    - New "LLMs.txt" and "LLMs-full.txt" settings tabs with per-page opt-in via enabled_in_llms frontmatter directive
    - Curated markdown index with configurable section groupings by URL prefix
    - Full page content rendered to markdown with HTML stripping, entity decoding, responsive mobile/desktop deduplication, and configurable cache TTL
    - Requires league/html-to-markdown ^5.1
1.2.0:
    - Added native support for RainLab.Blog and AlbrightLabs.Blog posts and categories in the sitemap
    - Auto-detects which blog plugin is installed; no configuration needed beyond URL prefix
    - Separate toggles for posts vs categories, configurable priority and change frequency
    - Cleared the legacy WordPress /blog/sitemap_index.xml default on External Blog Sitemap URL; existing installs keep their configured value
1.2.1:
    - Added an albrightlabs.sitemap.excludeUrl event so other plugins can veto a URL, for pages behind a release gate that redirect instead of returning 200
    - Dynamic pages are now excluded on any URL parameter (:id, :hash, and others) rather than only :slug, so parameterised routes no longer emit literal template URLs
1.2.2:
    - "Fixed a 500 on sitemap_pages.xml when the Tailor Sections list is cleared in the backend. Clearing the repeater stores null, and Setting::get's default only applies when the key is absent, so the cleared value reached foreach() as null and took down the whole sitemap. The value is now cast to an array."
1.2.3:
    - "Read every string-valued setting through a settingString() helper that falls back to the default on null as well as on absence. Setting::get only applies its default when the key is missing, so clearing a field in the backend stores null against it. The concrete bug this closes is rtrim() on the blog post and category URL prefixes, which raises a PHP 8.1+ deprecation and emits a malformed URL when either prefix is cleared on an install that has a blog plugin. robots.txt and humans.txt were already safe, since Laravel e() coalesces null internally. Same root cause as the 1.2.2 fatal, caught across the remaining settings so the next one added does not reintroduce it."
1.3.0:
    - "Added a Sitemap tab to page settings in the CMS Editor with Include in sitemap, priority, and change frequency controls for theme pages. The values are stored as the enabled_in_sitemap, priority, and changefreq page settings the sitemap already reads, so existing pages keep their current behaviour."
    - "The Cache TTL field on the LLMs-full.txt settings tab is now only shown when llms-full.txt is enabled."
1.4.0:
    - "Theme pages whose URL parameters are all optional (e.g. /cars/:path?) are now listed in the sitemap at their base URL (/cars) instead of being skipped. Pages with a required parameter are still left out. Controlled by the new Include pages with optional URL parameters setting, on by default."
    - "Added a Theme Content Folders repeater to the Sitemap tab. Each entry lists the content files in a theme content folder (as managed in the CMS Editor) at a URL prefix, with optional file extension, priority, and change frequency. For themes that serve content files through a wildcard page."
