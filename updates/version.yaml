1.0.1: First version of Sitemap Robots Humans
1.0.2:
    - Fixed security vulnerabilities
    - Added proper response handling
    - Added content sanitization
    - Added validation rules
    - Updated for October CMS 3.x compatibility
    - Added plugin.yaml for marketplace
    - Improved XML formatting
    - Added null safety checks
1.0.3:
    - Added full RainLab.Pages compatibility
    - Static pages now included in sitemap.xml
    - Added setting to toggle RainLab.Pages inclusion
    - Automatic detection of RainLab.Pages plugin
1.0.4:
    - Added OFFLINE.Boxes plugin compatibility
    - Visual page builder pages now included in sitemap.xml
    - Added setting to toggle OFFLINE.Boxes inclusion
    - Automatic detection of OFFLINE.Boxes plugin
    - Enhanced error handling for missing plugins
1.0.5:
    - Removed main navigation menu item
    - Plugin now only appears in Settings panel for cleaner admin UI
1.0.6:
    - Adds Tailor support
    - Adds support for sub-site sitemap
1.0.7:
    - Dynamic Tailor section support - configure any Tailor section for sitemap inclusion
    - Replaced hardcoded case studies with configurable repeater
    - Per-section URL prefix, priority, and change frequency settings
1.0.8:
    - UI Updates
1.0.9:
    - Added URL exclusion feature - exclude specific URLs or patterns from sitemap
    - Configurable exclusion patterns in Sitemap settings
    - Exclusions apply to all page types (CMS, RainLab.Pages, OFFLINE.Boxes, Tailor)
1.0.10:
    - Fixed closure scoping issue with URL exclusion helper function
1.1.0:
    - Added /llms.txt and /llms-full.txt routes for AI discovery
    - New "LLMs.txt" and "LLMs-full.txt" settings tabs with per-page opt-in via enabled_in_llms frontmatter directive
    - Curated markdown index with configurable section groupings by URL prefix
    - Full page content rendered to markdown with HTML stripping, entity decoding, responsive mobile/desktop deduplication, and configurable cache TTL
    - Requires league/html-to-markdown ^5.1
1.2.0:
    - Added native support for RainLab.Blog and AlbrightLabs.Blog posts and categories in the sitemap
    - Auto-detects which blog plugin is installed; no configuration needed beyond URL prefix
    - Separate toggles for posts vs categories, configurable priority and change frequency
    - Cleared the legacy WordPress /blog/sitemap_index.xml default on External Blog Sitemap URL; existing installs keep their configured value
