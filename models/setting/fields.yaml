# ===================================
#  Form Field Definitions
# ===================================

tabs:
    fields:
        enable_sitemap:
            label: Enable sitemap
            description: When checked, a sitemap.xml will automatically be generated.
            type: checkbox
            tab: Sitemap
        include_rainlab_pages:
            label: Include RainLab.Pages static pages
            description: When checked, static pages from RainLab.Pages plugin will be included in the sitemap (if plugin is installed).
            type: checkbox
            tab: Sitemap
            cssClass: field-indent
            trigger:
                field: enable_sitemap
                condition: checked
                action: show
        include_offline_boxes:
            label: Include OFFLINE.Boxes pages
            description: When checked, pages from OFFLINE.Boxes plugin will be included in the sitemap (if plugin is installed).
            type: checkbox
            tab: Sitemap
            cssClass: field-indent
            trigger:
                field: enable_sitemap
                condition: checked
                action: show
        include_optional_param_pages:
            label: Include pages with optional URL parameters
            description: When checked, pages whose URL parameters are all optional (e.g. /docs/:page?) are listed at their base URL.
            type: checkbox
            default: true
            tab: Sitemap
            cssClass: field-indent
            trigger:
                field: enable_sitemap
                condition: checked
                action: show
        blog_sitemap_url:
            label: External Blog Sitemap URL
            description: Only needed if your blog runs on a separate platform (e.g. WordPress) that produces its own sitemap. Leave empty in most cases - the options below generate blog URLs natively.
            type: text
            default: ''
            tab: Sitemap
            cssClass: field-indent
            trigger:
                field: enable_sitemap
                condition: checked
                action: show
        tailor_sections:
            label: Tailor Sections
            commentAbove: Configure which Tailor sections to include in the sitemap
            type: repeater
            tab: Sitemap
            cssClass: field-indent
            trigger:
                field: enable_sitemap
                condition: checked
                action: show
            form:
                fields:
                    section_handle:
                        label: Section
                        type: dropdown
                        span: left
                    url_prefix:
                        label: URL Prefix
                        type: text
                        placeholder: /blog/
                        span: right
                    priority:
                        label: Priority
                        type: dropdown
                        default: '0.6'
                        span: left
                        options:
                            '1.0': '1.0 (Highest)'
                            '0.8': '0.8'
                            '0.6': '0.6 (Default)'
                            '0.4': '0.4'
                            '0.2': '0.2 (Lowest)'
                    changefreq:
                        label: Change Frequency
                        type: dropdown
                        default: monthly
                        span: right
                        options:
                            daily: Daily
                            weekly: Weekly
                            monthly: Monthly
                            yearly: Yearly
        theme_content_folders:
            label: Theme Content Folders
            commentAbove: Configure which theme content folders to include in the sitemap
            type: repeater
            tab: Sitemap
            cssClass: field-indent
            trigger:
                field: enable_sitemap
                condition: checked
                action: show
            form:
                fields:
                    content_folder:
                        label: Content folder
                        type: dropdown
                        span: left
                    url_prefix:
                        label: URL Prefix
                        type: text
                        placeholder: /docs
                        span: right
                    keep_extension:
                        label: Include file extension in URL
                        comment: Check if files are served at /prefix/file.htm rather than /prefix/file.
                        type: checkbox
                    priority:
                        label: Priority
                        type: dropdown
                        default: '0.5'
                        span: left
                        options:
                            '1.0': '1.0 (Highest)'
                            '0.8': '0.8'
                            '0.6': '0.6'
                            '0.5': '0.5 (Default)'
                            '0.4': '0.4'
                            '0.2': '0.2 (Lowest)'
                    changefreq:
                        label: Change Frequency
                        type: dropdown
                        default: monthly
                        span: right
                        options:
                            daily: Daily
                            weekly: Weekly
                            monthly: Monthly
                            yearly: Yearly
        excluded_urls:
            label: Excluded URLs
            commentAbove: Enter URL patterns to exclude from the sitemap (one per line). Supports partial matching.
            type: textarea
            size: small
            tab: Sitemap
            cssClass: field-indent
            trigger:
                field: enable_sitemap
                condition: checked
                action: show
        enable_blog_posts:
            label: Include RainLab Blog posts
            description: When checked, published blog posts will be included in the sitemap. Supports RainLab.Blog and AlbrightLabs.Blog - the first installed plugin is used automatically.
            type: checkbox
            tab: Sitemap
            cssClass: field-indent
            trigger:
                field: enable_sitemap
                condition: checked
                action: show
        blog_post_url_prefix:
            label: Blog post URL prefix
            description: URL path for blog posts. Posts appear at {prefix}/{slug}. Default is /blog which matches the AlbrightLabs.Blog URL pattern; use /blog/post for the RainLab.Blog default.
            type: text
            default: /blog
            tab: Sitemap
            cssClass: field-indent
            trigger:
                field: enable_blog_posts
                condition: checked
                action: show
        enable_blog_categories:
            label: Include RainLab Blog categories
            description: When checked, blog category pages are also added to the sitemap.
            type: checkbox
            tab: Sitemap
            cssClass: field-indent
            trigger:
                field: enable_blog_posts
                condition: checked
                action: show
        blog_category_url_prefix:
            label: Blog category URL prefix
            description: URL path for blog categories. Categories appear at {prefix}/{slug}.
            type: text
            default: /blog/category
            tab: Sitemap
            cssClass: field-indent
            trigger:
                field: enable_blog_categories
                condition: checked
                action: show
        blog_priority:
            label: Blog priority
            type: dropdown
            default: '0.6'
            span: left
            tab: Sitemap
            cssClass: field-indent
            options:
                '1.0': '1.0 (Highest)'
                '0.8': '0.8'
                '0.6': '0.6 (Default)'
                '0.4': '0.4'
                '0.2': '0.2 (Lowest)'
            trigger:
                field: enable_blog_posts
                condition: checked
                action: show
        blog_changefreq:
            label: Blog change frequency
            type: dropdown
            default: weekly
            span: right
            tab: Sitemap
            cssClass: field-indent
            options:
                daily: Daily
                weekly: Weekly
                monthly: Monthly
                yearly: Yearly
            trigger:
                field: enable_blog_posts
                condition: checked
                action: show
        enable_robots:
            label: Enable robots
            description: When checked, a robots.txt file will be generated using the content provided.
            type: checkbox
            tab: Robots.txt
        robots_content:
            label: Robots content
            type: textarea
            size: large
            tab: Robots.txt
            cssClass: field-indent
            trigger:
                field: enable_robots
                condition: checked
                action: show
        enable_humans:
            label: Enable humans
            description: When checked, a humans.txt file will be generated using the content provided.
            type: checkbox
            tab: Humans.txt
        humans_content:
            label: Humans content
            type: textarea
            size: large
            tab: Humans.txt
            cssClass: field-indent
            trigger:
                field: enable_humans
                condition: checked
                action: show
        enable_llms:
            label: Enable llms.txt
            description: When checked, a curated markdown index will be generated at /llms.txt for AI crawlers.
            type: checkbox
            tab: LLMs.txt
        llms_summary:
            label: Summary blockquote
            commentAbove: One-sentence site summary rendered as the blockquote beneath the H1.
            type: textarea
            size: small
            tab: LLMs.txt
            cssClass: field-indent
            trigger:
                field: enable_llms
                condition: checked
                action: show
        llms_sections:
            label: Section grouping
            commentAbove: Optional. Group index links by URL prefix. Pages not matching any prefix fall under "Pages".
            type: repeater
            tab: LLMs.txt
            cssClass: field-indent
            trigger:
                field: enable_llms
                condition: checked
                action: show
            form:
                fields:
                    label:
                        label: Section label
                        type: text
                        span: left
                    url_prefix:
                        label: URL prefix
                        type: text
                        placeholder: /services
                        span: right
        enable_llms_full:
            label: Enable llms-full.txt
            description: When checked, full page content will be rendered as markdown at /llms-full.txt.
            type: checkbox
            tab: LLMs-full.txt
        llms_full_content_selector:
            label: Content selector
            description: CSS selector (tag, #id, or .class) identifying the main content region of each page. Defaults to "main".
            type: text
            default: main
            tab: LLMs-full.txt
            cssClass: field-indent
            trigger:
                field: enable_llms_full
                condition: checked
                action: show
        llms_cache_ttl:
            label: Cache TTL (seconds)
            description: How long generated llms.txt / llms-full.txt output is cached. Default 3600 (1 hour).
            type: number
            default: 3600
            tab: LLMs-full.txt
            cssClass: field-indent
            trigger:
                field: enable_llms_full
                condition: checked
                action: show
